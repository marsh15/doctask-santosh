[project]
name = "doctask-santosh"
version = "0.1.0"
description = "Governed project-delivery control register built from cited mixed-format evidence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "pypdf==6.15.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "python-docx==1.2.0",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.35.0",
  "mcp==2.0.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[project.scripts]
doctask-watch = "doctask.watcher:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
